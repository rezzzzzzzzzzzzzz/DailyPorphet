<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezziter - Channel Management</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Header -->
    <nav class="nav-header">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">Rezziter</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Message Feed</a>
                <a href="channels.html" class="nav-link active">Manage Channels</a>
                <button onclick="logout()" class="nav-link logout-btn">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Dashboard Stats -->
    <div id="dashboard-stats" class="dashboard-stats-container">
        <div class="stats-grid">
            <div class="stat-card loading-card">
                <div class="stat-icon">📊</div>
                <div class="stat-content">
                    <div class="stat-number">---</div>
                    <div class="stat-label">Total Messages</div>
                </div>
            </div>
            <div class="stat-card loading-card">
                <div class="stat-icon">📺</div>
                <div class="stat-content">
                    <div class="stat-number">---</div>
                    <div class="stat-label">Unique Channels</div>
                </div>
            </div>
            <div class="stat-card loading-card">
                <div class="stat-icon">⚡</div>
                <div class="stat-content">
                    <div class="stat-number">---</div>
                    <div class="stat-label">Messages in Last 24h</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sorting and Filter Controls -->
    <div class="controls-container">
        <div class="controls-header">
            <h2>Channel Management</h2>
            <div class="controls-actions">
                <div class="sort-controls">
                    <span class="sort-label">Sort by:</span>
                    <div class="sort-buttons">
                        <button id="sort-by-name" class="sort-btn active">
                            <span class="sort-icon">🔤</span>
                            Name
                        </button>
                        <button id="sort-by-count" class="sort-btn">
                            <span class="sort-icon">📊</span>
                            Message Count
                        </button>
                    </div>
                </div>
                <button id="clear-all-btn" class="clear-all-btn">
                    <span class="clear-icon">🗑️</span>
                    Clear All Messages
                </button>
            </div>
        </div>
    </div>

    <!-- Channel Grid Container -->
    <div id="channel-grid" class="channel-grid-container">
        <!-- Channel cards will be populated here by channels.js -->
    </div>

    <!-- Load configuration and authentication -->
    <script>
        // Initialize empty config if config.local.js doesn't exist
        window.REZZITER_CONFIG = window.REZZITER_CONFIG || {};
    </script>
    <script src="config.local.js" onerror="console.log('config.local.js not found, using defaults')"></script>
    <script src="auth.js"></script>
    
    <script src="channels.js"></script>
</body>
</html>
